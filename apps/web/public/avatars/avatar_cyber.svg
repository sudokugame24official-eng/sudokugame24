<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#A855F7" flood-opacity="0.7"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="56" fill="#1E0E2E" stroke="url(#purpleGrad)" stroke-width="4"/>
  <circle cx="60" cy="60" r="48" fill="#12051E"/>
  <!-- Quantum Orb & Lightning -->
  <g filter="url(#purpleGlow)">
    <circle cx="60" cy="60" r="22" fill="url(#purpleGrad)"/>
    <ellipse cx="60" cy="60" rx="32" ry="12" fill="none" stroke="#C084FC" stroke-width="2" transform="rotate(-30 60 60)"/>
    <ellipse cx="60" cy="60" rx="32" ry="12" fill="none" stroke="#E9D5FF" stroke-width="1.5" transform="rotate(40 60 60)"/>
    <circle cx="60" cy="60" r="8" fill="#FFFFFF"/>
  </g>
</svg>
