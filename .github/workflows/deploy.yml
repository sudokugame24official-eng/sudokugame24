name: Sudoku Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy to Environment (Staging / Production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  validate-and-build:
    name: Validation & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit
        
      - name: Prisma Schema Validation
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Run Unit Tests
        run: npm run test

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build Web
        run: npm run build --workspace=apps/web

  # -------------------------------------------------------------
  # STAGING PIPELINE
  # -------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Apply Staging DB Migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Deploy API to Railway (Staging)
        run: |
          echo "Deploying to Railway (Staging)..."
          # Requires Railway CLI & RAILWAY_TOKEN
          # npx railway up -e staging

      - name: Deploy Web to Vercel (Staging)
        run: |
          echo "Deploying to Vercel (Staging)..."
          # npx vercel --prod --token $VERCEL_TOKEN

      - name: Staging Smoke Tests
        run: |
          echo "Running smoke tests against staging..."

      - name: Phase 7.5 E2E Regression Suite
        run: |
          echo "Running extensive forensic regression tests..."
          # npx tsx test-scripts-final/run-all.ts (pointed at staging URL)

  # -------------------------------------------------------------
  # PRODUCTION PIPELINE
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.event.inputs.deploy_target == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sudoku.com
    steps:
      - name: Require Manual Approval
        run: echo "Production deployment must be manually approved via GitHub Environments."

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Apply Production DB Migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Deploy API to Railway (Production)
        run: |
          echo "Deploying to Railway (Production)..."

      - name: Deploy Web to Vercel (Production)
        run: |
          echo "Deploying to Vercel (Production)..."

      - name: Production Smoke Tests
        run: |
          echo "Running smoke tests against production..."
